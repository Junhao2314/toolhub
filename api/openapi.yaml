          oneOf:
            - type: 'null'
            - type: object
              required: [snapshot, manifest]
              properties:
                snapshot: {$ref: '#/components/schemas/DesiredSnapshot'}
                manifest: {$ref: '#/components/schemas/DesiredManifest'}
    InventoryMember:
      type: object
      required: [id, kind, name, protected]
      properties:
        id: {type: string}
        kind: {type: string, enum: [skill, mcp, anchor, entry]}
