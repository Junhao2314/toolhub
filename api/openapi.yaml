        errorReason: {type: string, maxLength: 200}
    RelayCapabilityCounts:
      type: object
      additionalProperties: false
      required: [tools, resources, resourceTemplates, prompts]
      properties:
        tools: {type: integer, minimum: 0}
        resources: {type: integer, minimum: 0}
        resourceTemplates: {type: integer, minimum: 0}
        prompts: {type: integer, minimum: 0}
