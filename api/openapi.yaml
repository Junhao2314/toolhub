        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Target:
      type: object
      required: [id, targetKey, nodeId, nodeName, nodeKind, runtime, managedUsername, writable, health, desiredRevision, relayFailureCount, relaySuspended, relayMemberStatuses]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        targetKey: {type: string}
        nodeId: {$ref: '#/components/schemas/UUID'}
        nodeName: {type: string}
        nodeKind: {type: string, enum: [local, salt]}
        saltMinionId: {type: string}
        runtime: {type: string, enum: [claude, codex, hermes, shared-relay]}
        managedUsername: {type: string}
        writable: {type: boolean}
        health: {$ref: '#/components/schemas/Health'}
