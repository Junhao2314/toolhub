        serverId: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, minimum: 1}
        name: {type: string}
        transport: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        envRefs: {$ref: '#/components/schemas/SecretReferenceMap'}
