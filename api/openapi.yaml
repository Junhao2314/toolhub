        resourceType: {type: string}
        resourceId: {type: string}
        outcome: {type: string}
        ipAddress: {type: string}
        metadata: {type: object}
        createdAt: {type: string, format: date-time}
    SettingsInput:
      type: object
      additionalProperties: false
      required: [managedUsername, updateCron, timezone, relayPort, relayIntentionalPaused]
      properties:
        managedUsername: {type: string, pattern: '^[a-z_][a-z0-9_-]{0,31}$'}
        updateCron: {type: string}
        timezone: {type: string}
        relayPort: {type: integer, minimum: 1, maximum: 65535}
