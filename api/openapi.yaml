openapi: 3.1.0
info:
  title: ToolHub Browser API
  version: 2.0.0
  description: |
    Generation-2 single-user control-plane API. Unsafe authenticated requests
    require the session CSRF token. Operations that declare Idempotency-Key
    reject key reuse with a different request.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Library
  - name: Profiles
  - name: Targets
  - name: Operations
  - name: Settings
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/session:
    get:
      tags: [Auth]
      security: []
      operationId: sessionProbe
      responses:
        '200': {$ref: '#/components/responses/SessionProbe'}
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: rotateCSRF
      responses:
        '200':
          description: Rotated CSRF token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrfToken]
                properties: {csrfToken: {type: string}}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
  /account:
    get:
      tags: [Auth]
      operationId: getAccount
      responses:
        '200':
          description: Singleton account
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
  /account/username:
    patch:
      tags: [Auth]
      operationId: updateUsername
      description: Changes the singleton username and revokes every session.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, currentPassword]
              properties:
                username: {$ref: '#/components/schemas/Username'}
                currentPassword: {type: string, format: password, writeOnly: true}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
  /account/password:
    patch:
      tags: [Auth]
      operationId: updatePassword
      description: Changes the singleton password and revokes every session.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, format: password, writeOnly: true}
                newPassword: {type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
  /overview:
    get:
      operationId: getOverview
      responses:
        '200':
          description: Aggregated generation-2 health counters
          content: {application/json: {schema: {$ref: '#/components/schemas/Overview'}}}
  /skills:
    get:
      tags: [Library]
      operationId: listSkills
      responses:
        '200': {$ref: '#/components/responses/SkillList'}
  /skills/upload:
    post:
      tags: [Library]
      operationId: uploadSkill
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        '200': {$ref: '#/components/responses/Skill'}
        '201': {$ref: '#/components/responses/Skill'}
        '400': {$ref: '#/components/responses/Error'}
  /skills/import:
    post:
      tags: [Library]
      operationId: importSkill
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SkillSourceInput'}}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /market/search:
    get:
      tags: [Library]
      operationId: searchMarketplace
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: source, in: query, schema: {type: string, enum: [skillsmp, xiaping]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Normalized provider result, content: {application/json: {schema: {type: object}}}}
        '429': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /recommendations:
    post:
      tags: [Library]
      operationId: recommendSkills
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/JSONObject'}
      responses:
        '200':
          description: Recommendations; automaticInstall is always false.
          content:
            application/json:
              schema:
                type: object
                required: [candidates, automaticInstall]
                properties:
                  candidates: {type: array, items: {type: object}}
                  automaticInstall: {const: false}
  /mcp/servers:
    get:
      tags: [Library]
      operationId: listMCPServers
      responses:
        '200': {$ref: '#/components/responses/MCPServerList'}
    post:
      tags: [Library]
      operationId: createMCPServer
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MCPServerInput'}}}
      responses:
        '201': {$ref: '#/components/responses/MCPServer'}
        '400': {$ref: '#/components/responses/Error'}
  /mcp/servers/{serverID}:
    parameters: [{$ref: '#/components/parameters/ServerID'}]
    put:
      tags: [Library]
      operationId: updateMCPServer
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MCPServerInput'}}}
      responses:
        '200': {$ref: '#/components/responses/MCPServer'}
        '400': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Library]
      operationId: deleteMCPServer
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '409': {$ref: '#/components/responses/Error'}
  /mcp/import:
    post:
      tags: [MCP]
      operationId: importLocalMCPServer
      description: Consumes one revision-bound confirmation and queues an ephemeral, one-time local MCP capture.
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmationToken]
              properties: {confirmationToken: {type: string, minLength: 1, writeOnly: true}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      responses:
        '200': {$ref: '#/components/responses/ProfileList'}
    post:
      tags: [Profiles]
      operationId: createProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfileInput'}}}
      responses:
        '201': {$ref: '#/components/responses/Profile'}
  /profiles/{profileID}:
    parameters: [{$ref: '#/components/parameters/ProfileID'}]
    put:
      tags: [Profiles]
      operationId: updateProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfileInput'}}}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Profiles]
      operationId: deleteProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '409': {$ref: '#/components/responses/Error'}
  /profiles/{profileID}/preflight:
    post:
      tags: [Profiles]
      operationId: preflightProfile
      description: Resolves current Library revisions and returns five-minute, one-use confirmation tokens.
      parameters:
        - {$ref: '#/components/parameters/ProfileID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetIds]
              properties:
                targetIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200': {$ref: '#/components/responses/PreflightList'}
        '409': {$ref: '#/components/responses/Error'}
  /profiles/{profileID}/apply:
    post:
      tags: [Profiles]
      operationId: applyProfile
      parameters:
        - {$ref: '#/components/parameters/ProfileID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmationTokens]
              properties:
                confirmationTokens: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /nodes:
    get:
      tags: [Targets]
      operationId: listNodes
      responses:
        '200': {$ref: '#/components/responses/NodeList'}
  /nodes/refresh:
    post:
      tags: [Targets]
      operationId: refreshNodes
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /nodes/{nodeID}:
    patch:
      tags: [Targets]
      operationId: updateNodeManagedUsername
      description: Sets a Salt node managed-username override. An empty string clears the override and restores the global managed username.
      parameters:
        - {$ref: '#/components/parameters/NodeID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [managedUsername]
              properties: {managedUsername: {type: string, maxLength: 32, pattern: '^(?:[a-z_][a-z0-9_-]{0,31})?$'}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /targets:
    get:
      tags: [Targets]
      operationId: listTargets
      responses:
        '200': {$ref: '#/components/responses/TargetList'}
  /targets/{targetID}:
    get:
      tags: [Targets]
      operationId: getTarget
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      responses:
        '200':
          description: Target, latest inventory, and active immutable desired snapshot.
          content: {application/json: {schema: {$ref: '#/components/schemas/TargetDetail'}}}
        '404': {$ref: '#/components/responses/Error'}
  /targets/{targetID}/scan:
    post:
      tags: [Targets]
      operationId: scanTarget
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /targets/{targetID}/skill-import:
    post:
      tags: [Targets]
      operationId: importLocalSkill
      description: Queues an immutable Library import of one scanned, unmanaged local Skill.
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, expectedRevision, contentHash]
              properties:
                name: {type: string, minLength: 1}
                expectedRevision: {$ref: '#/components/schemas/SHA256'}
                contentHash: {$ref: '#/components/schemas/SHA256'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /targets/{targetID}/mcp-import/preflight:
    post:
      tags: [Targets]
      operationId: preflightLocalMCPImport
      description: Returns only sanitized local user-scope MCP fields and key names; secret values are never returned to the browser.
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '200':
          description: Five-minute, one-use confirmations bound to the current native configuration revision.
          content: {application/json: {schema: {$ref: '#/components/schemas/LocalMCPImportPreflight'}}}
        '409': {$ref: '#/components/responses/Error'}
  /targets/{targetID}/edit:
    post:
      tags: [Targets]
      operationId: editTarget
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, skillIds, mcpServerIds]
              properties:
                expectedRevision: {$ref: '#/components/schemas/SHA256'}
                skillIds: {type: array, maxItems: 500, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
                mcpServerIds: {type: array, maxItems: 500, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /targets/{targetID}/backups:
    get:
      tags: [Targets]
      operationId: listBackups
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      responses:
        '200': {$ref: '#/components/responses/BackupList'}
  /targets/{targetID}/restore:
    post:
      tags: [Targets]
      operationId: restoreTarget
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [backupId, expectedRevision]
              properties: {backupId: {$ref: '#/components/schemas/UUID'}, expectedRevision: {$ref: '#/components/schemas/SHA256'}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /targets/{targetID}/relay/{action}:
    post:
      tags: [Targets]
      operationId: relayAction
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {name: action, in: path, required: true, schema: {type: string, enum: [start, stop, restart, health]}}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /operations:
    get:
      tags: [Operations]
      operationId: listOperations
      responses:
        '200': {$ref: '#/components/responses/OperationList'}
  /operations/{operationID}:
    get:
      tags: [Operations]
      operationId: getOperation
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '404': {$ref: '#/components/responses/Error'}
  /operations/{operationID}/cancel:
    post:
      tags: [Operations]
      operationId: cancelOperation
      parameters:
        - {$ref: '#/components/parameters/OperationID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '409': {$ref: '#/components/responses/Error'}
  /operations/{operationID}/retry-failed:
    post:
      tags: [Operations]
      operationId: retryFailedTargets
      parameters:
        - {$ref: '#/components/parameters/OperationID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /audit:
    get:
      tags: [Operations]
      operationId: listAudit
      responses:
        '200': {$ref: '#/components/responses/AuditList'}
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      responses:
        '200': {$ref: '#/components/responses/Settings'}
    put:
      tags: [Settings]
      operationId: updateSettings
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SettingsInput'}}}
      responses:
        '200': {$ref: '#/components/responses/Settings'}
        '400': {$ref: '#/components/responses/Error'}
  /updates/check:
    post:
      tags: [Settings]
      operationId: checkUpdates
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: toolhub_session}
  parameters:
    CSRFToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    NodeID: {name: nodeID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    TargetID: {name: targetID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ProfileID: {name: profileID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ServerID: {name: serverID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    OperationID: {name: operationID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
  requestBodies:
    JSONObject:
      required: true
      content: {application/json: {schema: {type: object}}}
  responses:
    NoContent: {description: No content}
    Error:
      description: Error envelope
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Session: {description: Session state, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    SessionProbe: {description: Authenticated or anonymous session probe, content: {application/json: {schema: {$ref: '#/components/schemas/SessionProbe'}}}}
    Skill: {description: Immutable Skill library record, content: {application/json: {schema: {$ref: '#/components/schemas/Skill'}}}}
    SkillList: {description: Skills, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Skill'}}}}}}}
    MCPServer: {description: MCP server without secret values, content: {application/json: {schema: {$ref: '#/components/schemas/MCPServer'}}}}
    MCPServerList: {description: MCP servers, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/MCPServer'}}}}}}}
    Profile: {description: Unified Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
    ProfileList: {description: Profiles, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Profile'}}}}}}}
    NodeList: {description: Nodes, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Node'}}}}}}}
    TargetList: {description: Targets, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Target'}}}}}}}
    Operation: {description: Durable operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
    OperationList: {description: Operations, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Operation'}}}}}}}
    BackupList: {description: Backups, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Backup'}}}}}}}
    AuditList: {description: Actorless audit events, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}}}}}}
    Settings: {description: Singleton settings, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
    PreflightList: {description: Per-target preflight confirmations, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PreflightItem'}}}}}}}
  schemas:
    UUID: {type: string, format: uuid}
    Username: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,31}$'}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
            details: {type: object}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        password: {type: string, format: password, writeOnly: true}
    Account:
      type: object
      additionalProperties: false
      required: [username, passwordChangeRecommended, createdAt, updatedAt]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        passwordChangeRecommended: {type: boolean}
        passwordChangedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, user, csrfToken, expiresAt]
      properties:
        authenticated: {const: true}
        user: {$ref: '#/components/schemas/Account'}
        csrfToken: {type: string, writeOnly: true}
        expiresAt: {type: string, format: date-time}
    SessionProbe:
      oneOf:
        - type: object
          additionalProperties: false
          required: [authenticated]
          properties:
            authenticated: {const: false}
        - type: object
          additionalProperties: false
          required: [authenticated, user, csrfToken, expiresAt]
          properties:
            authenticated: {const: true}
            user:
              type: object
              additionalProperties: false
              required: [username, passwordChangeRecommended]
              properties:
                username: {$ref: '#/components/schemas/Username'}
                passwordChangeRecommended: {type: boolean}
            csrfToken: {type: string, writeOnly: true}
            expiresAt: {type: string, format: date-time}
    Overview:
      type: object
      required: [targets, unhealthyTargets, skills, mcpServers, activeOperations, openAlerts, auditEvents24h]
      properties:
        targets: {type: integer}
        unhealthyTargets: {type: integer}
        skills: {type: integer}
        mcpServers: {type: integer}
        activeOperations: {type: integer}
        openAlerts: {type: integer}
        auditEvents24h: {type: integer}
    SkillSourceInput:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {type: string, enum: [git, skillsmp, xiaping]}
        name: {type: string}
        url: {type: string, format: uri}
        subdirectory: {type: string}
        commit: {type: string}
        metadata: {type: object}
    Skill:
      type: object
      required: [id, slug, name, sourceKind, currentVersionId, currentSha256, currentContentHash, manifest, scanReport, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        sourceKind: {type: string, enum: [zip, git, skillsmp, xiaping, local]}
