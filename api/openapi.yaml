        targetRevision: {type: string}
        driftSummary: {type: object}
        lastScannedAt: {type: [string, 'null'], format: date-time}
        lastReconciledAt: {type: [string, 'null'], format: date-time}
        errorCode: {type: string}
        errorReason: {type: string}
        relayFailureCount: {type: integer, minimum: 0}
        relayNextRetryAt: {type: [string, 'null'], format: date-time}
        relaySuspended: {type: boolean}
        relayLastMemberCheckAt: {type: [string, 'null'], format: date-time}
        relayMemberStatuses: {type: array, items: {$ref: '#/components/schemas/RelayMemberStatus'}}
