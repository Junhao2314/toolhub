        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        attempt: {type: integer, minimum: 1}
        pendingRerun: {type: boolean}
        bridgeOperationId: {$ref: '#/components/schemas/UUID'}
        saltJid: {type: string, pattern: '^[0-9]{8,32}$'}
