openapi: 3.1.0
info:
  title: ToolHub API
  version: 0.1.0
  description: Tailnet-only control plane with PostgreSQL desired state, materialized Skills, and mcpm-backed MCP delivery for Codex and Claude. Node-local shared sources are read-only import inputs.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '401': {$ref: '#/components/responses/Error'}}
  /auth/logout:
    post: {operationId: logout, responses: {'204': {description: Logged out}}}
  /auth/me:
    get: {operationId: getCurrentUser, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /auth/session:
    get: {security: [], operationId: probeSession, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /auth/csrf:
    get: {operationId: rotateCSRF, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /account/username:
    patch:
      operationId: updateOwnUsername
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUsernameRequest'}}}}
      responses: {'204': {description: Username updated and all sessions revoked}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /account/password:
    patch:
      operationId: updateOwnPassword
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePasswordRequest'}}}}
      responses: {'204': {description: Password updated and all sessions revoked}, '403': {$ref: '#/components/responses/Error'}}
  /overview:
    get: {operationId: getOverview, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /users:
    get: {operationId: listUsers, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post:
      operationId: createUser
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/JSON'}, '409': {$ref: '#/components/responses/Error'}}
  /users/{id}/password:
    post:
      operationId: resetUserPassword
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TemporaryPasswordRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '404': {$ref: '#/components/responses/Error'}}
  /nodes:
    get: {operationId: listNodes, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post: {operationId: createEnrollment, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'201': {$ref: '#/components/responses/JSON'}}}
  /nodes/{id}:
    get: {operationId: getNode, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
    patch: {operationId: updateNode, parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    delete: {operationId: archiveNode, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Archived}}}
  /nodes/{id}/scan:
    post: {operationId: scanNode, parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /nodes/{id}/connections:
    post: {operationId: createNodeConnection, parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'201': {$ref: '#/components/responses/JSON'}}}
  /skills:
    get: {operationId: listSkills, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post: {operationId: importSkill, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /skills/upload:
    post:
      operationId: uploadSkill
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {file: {type: string, format: binary}}, required: [file]}}}}
      responses: {'201': {$ref: '#/components/responses/JSON'}}
  /skills/{id}:
    get: {operationId: getSkill, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
    delete: {operationId: archiveSkill, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Archived for 30 days}}}
  /skills/{id}/review:
    post: {operationId: reviewSkill, parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /skills/{id}/deployments:
    post: {operationId: setSkillTargets, parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /sources:
    get: {operationId: listSources, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /deployments:
    get: {operationId: listDeployments, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /deployments/{id}/rollback:
    post:
      operationId: rollbackDeployment
      description: Queues a desired-state rollback. A deployment with a previous version swaps versions; a first successful deployment rolls back to disabled while retaining its version for safe Agent removal.
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'202': {$ref: '#/components/responses/JSON'}, '404': {$ref: '#/components/responses/Error'}}
  /updates:
    get: {operationId: listUpdates, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post: {operationId: checkUpdates, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /updates/{id}/approve:
    post: {operationId: approveUpdate, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /sync:
    post: {operationId: sync, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /reconcile:
    post:
      operationId: reconcileRuntimeState
      description: Queues scoped Skill and ToolHub-authoritative MCP reconciliation jobs. Job success means orchestration completed, not that every Agent task has completed.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/JSON'}}
  /discoveries:
    get:
      operationId: listRuntimeDiscoveries
      description: Lists read-only Skill discoveries and automatically managed MCP runtime bindings. Secret fingerprints and values are omitted.
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /discoveries/{id}/adopt-skill:
    post:
      operationId: adoptDiscoveredSkill
      description: Administrator-only request that queues a signed Agent adoption task. The imported snapshot remains pending review.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'202': {$ref: '#/components/responses/JSON'}, '404': {$ref: '#/components/responses/Error'}}
  /shared-sources:
    get:
      operationId: listSharedSources
      description: Lists redacted node-local shared source state as a read-only discovery/import surface. Secret values are never returned and no shared-source writer endpoint exists.
      responses: {'200': {$ref: '#/components/responses/JSON'}}
  /shared-sources/{id}:
    get:
      operationId: getSharedSource
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {$ref: '#/components/responses/JSON'}, '404': {$ref: '#/components/responses/Error'}}
  /jobs:
    get: {operationId: listJobs, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /jobs/{id}/cancel:
    post: {operationId: cancelJob, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /market/search:
    get:
      operationId: searchMarket
      parameters: [{name: q, in: query, required: true, schema: {type: string}}, {name: page, in: query, schema: {type: integer, minimum: 1}}]
      responses: {'200': {$ref: '#/components/responses/JSON'}, '429': {$ref: '#/components/responses/Error'}}
  /recommendations:
    post: {operationId: recommendSkills, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /mcp/servers:
    get:
      operationId: listMCPServers
      description: Lists central servers plus redacted import provenance. mcpm imports are enabled baselines; legacy shared-manifest imports are disabled review candidates and may carry a conflict-renamed display name.
      responses: {'200': {$ref: '#/components/responses/JSON'}}
    post:
      operationId: createMCPServer
      description: Creates a ToolHub-authoritative MCP server. Environment and HTTP header values are encrypted and ordinary responses contain references only.
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}}
  /mcp/servers/{id}:
    patch: {operationId: updateMCPServer, parameters: [{$ref: '#/components/parameters/ID'}], requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}, '409': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteMCPServer, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Error'}}}
  /mcp/servers/{id}/health:
    post: {operationId: checkMCPServer, parameters: [{$ref: '#/components/parameters/ID'}], responses: {'202': {$ref: '#/components/responses/JSON'}}}
  /mcp/profiles:
    get:
      operationId: listMCPProfiles
      description: Lists profiles and membership. Initial mcpm discovery creates fixed toolhub-codex and toolhub-claude profiles with managedRuntime provenance.
      responses: {'200': {$ref: '#/components/responses/JSON'}}
    post: {operationId: createMCPProfile, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'201': {$ref: '#/components/responses/JSON'}, '409': {$ref: '#/components/responses/Error'}}}
  /mcp/profiles/{id}/servers:
    put:
      operationId: setManagedMCPProfileServers
      description: Replaces membership for a fixed toolhub-codex or toolhub-claude profile. An observed deployment remains observed until it is explicitly deployed.
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MCPProfileServersRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /mcp/deployments:
    get: {operationId: listMCPDeployments, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post:
      operationId: deployMCPProfile
      description: Explicitly transitions an observed fixed profile deployment to pending and queues mcp_sync. The profile managedRuntime must exactly match the Codex or Claude target runtime; arbitrary profiles are never dispatched to the fixed native anchor.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MCPDeploymentRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/JSON'}}
  /settings:
    get: {operationId: getSettings, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    patch: {operationId: updateSettings, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'200': {$ref: '#/components/responses/JSON'}}}
  /settings/ai-providers:
    get: {operationId: listAIProviders, responses: {'200': {$ref: '#/components/responses/JSON'}}}
    post: {operationId: createAIProvider, requestBody: {$ref: '#/components/requestBodies/JSON'}, responses: {'201': {$ref: '#/components/responses/JSON'}}}
  /audit:
    get: {operationId: listAudit, responses: {'200': {$ref: '#/components/responses/JSON'}}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: toolhub_session}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  requestBodies:
    JSON: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
  responses:
    JSON: {description: JSON response, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
    Error: {description: Error response, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties: {identifier: {type: string, minLength: 1}, password: {type: string, minLength: 12}}
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: '^[a-z0-9._-]+$'
    UpdateUsernameRequest:
      type: object
      additionalProperties: false
      required: [username, currentPassword]
      properties: {username: {$ref: '#/components/schemas/Username'}, currentPassword: {type: string}}
    UpdatePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties: {currentPassword: {type: string}, newPassword: {type: string, minLength: 12, maxLength: 1024}}
    TemporaryPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        mode: {type: string, enum: [random, manual]}
        password: {type: string, minLength: 12, maxLength: 1024, description: Required only in manual mode and never echoed in the response.}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, email, displayName, role]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1}
        role: {type: string, enum: [admin, operator, viewer]}
        passwordMode: {type: string, enum: [random, manual]}
        password: {type: string, minLength: 12, maxLength: 1024, description: Required only in manual mode.}
    ReconcileRequest:
      type: object
      additionalProperties: false
      properties:
        nodeIds: {type: array, items: {type: string, format: uuid}}
        skillIds: {type: array, items: {type: string, format: uuid}}
        profileIds: {type: array, items: {type: string, format: uuid}}
        mcpDeploymentIds: {type: array, items: {type: string, format: uuid}}
        dryRun: {type: boolean, default: false}
    MCPProfileServersRequest:
      type: object
      additionalProperties: false
      required: [serverIds]
      properties:
        serverIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
    MCPDeploymentRequest:
      type: object
      additionalProperties: false
      required: [profileId, targets]
      properties:
        profileId: {type: string, format: uuid}
        targets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nodeId, runtime, enabled]
            properties:
              nodeId: {type: string, format: uuid}
              runtime: {type: string, enum: [codex, claude]}
              enabled: {type: boolean}
        dryRun: {type: boolean, default: false}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: {code: {type: string}, message: {type: string}, requestId: {type: string}}
