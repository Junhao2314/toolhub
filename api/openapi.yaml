        targetRevision: {$ref: '#/components/schemas/SHA256'}
        items: {type: array, items: {$ref: '#/components/schemas/LocalMCPServerPreview'}}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [name, description, revision, skillIds, mcpServerIds]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string}
        revision: {type: integer, minimum: 0}
        skillIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
        mcpServerIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
    Profile:
      allOf:
        - {$ref: '#/components/schemas/ProfileInput'}
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    Node:
      type: object
      additionalProperties: false
      required: [id, name, kind, status, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        kind: {type: string, enum: [local, salt]}
        saltMinionId: {type: string}
        managedUsernameOverride: {type: [string, 'null'], pattern: '^[a-z_][a-z0-9_-]{0,31}$'}
