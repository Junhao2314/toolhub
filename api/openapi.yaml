      type: object
      additionalProperties: false
      required: [memberId, name, status, capabilityKinds, capabilities, checkedAt]
      properties:
        memberId: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        status: {type: string, enum: [ready, unavailable]}
        capabilityKinds: {type: array, uniqueItems: true, items: {type: string, enum: [tools, resources, resourceTemplates, prompts]}}
        capabilities: {$ref: '#/components/schemas/RelayCapabilityCounts'}
        checkedAt: {type: string, format: date-time}
        errorCode: {type: string}
        errorReason: {type: string, maxLength: 200}
    SHA256: {type: string, pattern: '^[a-f0-9]{64}$'}
    Health: {type: string, enum: [healthy, drifted, repairing, blocked, unavailable]}
    OperationStatus: {type: string, enum: [queued, running, succeeded, partial, failed, cancelled]}
