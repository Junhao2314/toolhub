      type: object
      required: [id, revision, sourceKind, manifestHash, createdAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, minimum: 1}
        sourceKind: {type: string, enum: [profile_apply, target_edit, restore]}
        sourceId: {$ref: '#/components/schemas/UUID'}
