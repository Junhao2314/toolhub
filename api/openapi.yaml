        contentHash: {type: string}
        protected: {type: boolean}
        scope: {type: string}
        revision: {type: integer, minimum: 1}
        secretKeys: {type: array, items: {type: string}}
    DesiredManifest:
      type: object
      additionalProperties: false
      required: [schemaVersion, target, skills, mcpServers, managedMemberIds]
      properties:
        schemaVersion: {const: 1}
        target: {$ref: '#/components/schemas/ManifestTarget'}
        profileId: {$ref: '#/components/schemas/UUID'}
        profileRevision: {type: integer, minimum: 1}
        skills: {type: array, items: {$ref: '#/components/schemas/SkillMember'}}
        mcpServers: {type: array, items: {$ref: '#/components/schemas/MCPMember'}}
        managedMemberIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
        relayPort: {type: integer, minimum: 1, maximum: 65535}
    ManifestTarget:
      type: object
      additionalProperties: false
      required: [id, nodeId, nodeKind, runtime, managedUsername]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        nodeId: {$ref: '#/components/schemas/UUID'}
        nodeKind: {type: string, enum: [local, salt]}
        saltMinionId: {type: string}
        runtime: {type: string, enum: [claude, codex, hermes, shared-relay]}
        managedUsername: {type: string}
    SkillMember:
      type: object
      additionalProperties: false
      required: [memberId, skillId, versionId, slug, sha256, contentHash]
      properties:
        memberId: {$ref: '#/components/schemas/UUID'}
        skillId: {$ref: '#/components/schemas/UUID'}
        versionId: {$ref: '#/components/schemas/UUID'}
        slug: {type: string}
        sha256: {$ref: '#/components/schemas/SHA256'}
        contentHash: {$ref: '#/components/schemas/SHA256'}
    MCPMember:
      type: object
      additionalProperties: false
