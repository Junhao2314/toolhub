openapi: 3.1.0
info:
  title: ToolHub Browser API
  version: 2.0.0
  description: |
    Generation-2 single-user control-plane API. Unsafe authenticated requests
    require the session CSRF token. Operations that declare Idempotency-Key
    reject key reuse with a different request.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Library
  - name: Profiles
  - name: Targets
  - name: Operations
  - name: Governance
  - name: Settings
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/session:
    get:
      tags: [Auth]
      security: []
      operationId: sessionProbe
      responses:
        '200': {$ref: '#/components/responses/SessionProbe'}
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: rotateCSRF
      responses:
        '200':
          description: Rotated CSRF token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrfToken]
                properties: {csrfToken: {type: string}}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Error'}
  /account:
    get:
      tags: [Auth]
      operationId: getAccount
      responses:
        '200':
          description: Singleton account
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
  /account/username:
    patch:
      tags: [Auth]
      operationId: updateUsername
      description: Changes the singleton username and revokes every session.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, currentPassword]
              properties:
                username: {$ref: '#/components/schemas/Username'}
                currentPassword: {type: string, format: password, writeOnly: true}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
  /account/password:
    patch:
      tags: [Auth]
      operationId: updatePassword
      description: Changes the singleton password and revokes every session.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, format: password, writeOnly: true}
                newPassword: {type: string, format: password, minLength: 12, maxLength: 1024, writeOnly: true}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
  /overview:
    get:
      operationId: getOverview
      responses:
        '200':
          description: Aggregated generation-2 health counters
          content: {application/json: {schema: {$ref: '#/components/schemas/Overview'}}}
  /skills:
    get:
      tags: [Library]
      operationId: listSkills
      responses:
        '200': {$ref: '#/components/responses/SkillList'}
  /skills/upload:
    post:
      tags: [Library]
      operationId: uploadSkill
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        '200': {$ref: '#/components/responses/Skill'}
        '201': {$ref: '#/components/responses/Skill'}
        '400': {$ref: '#/components/responses/Error'}
  /skills/import:
    post:
      tags: [Library]
      operationId: importSkill
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SkillSourceInput'}}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /market/search:
    get:
      tags: [Library]
      operationId: searchMarketplace
      parameters:
        - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: source, in: query, schema: {type: string, enum: [skillsmp, xiaping]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Normalized provider result, content: {application/json: {schema: {type: object}}}}
        '429': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /recommendations:
    post:
      tags: [Library]
      operationId: recommendSkills
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {$ref: '#/components/requestBodies/JSONObject'}
      responses:
        '200':
          description: Recommendations; automaticInstall is always false.
          content:
            application/json:
              schema:
                type: object
                required: [candidates, automaticInstall]
                properties:
                  candidates: {type: array, items: {type: object}}
                  automaticInstall: {const: false}
  /mcp/servers:
    get:
      tags: [Library]
      operationId: listMCPServers
      responses:
        '200': {$ref: '#/components/responses/MCPServerList'}
    post:
      tags: [Library]
      operationId: createMCPServer
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MCPServerInput'}}}
      responses:
        '201': {$ref: '#/components/responses/MCPServer'}
        '400': {$ref: '#/components/responses/Error'}
  /mcp/servers/{serverID}:
    parameters: [{$ref: '#/components/parameters/ServerID'}]
    put:
      tags: [Library]
      operationId: updateMCPServer
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MCPServerInput'}}}
      responses:
        '200': {$ref: '#/components/responses/MCPServer'}
        '400': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Library]
      operationId: deleteMCPServer
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '409': {$ref: '#/components/responses/Error'}
  /mcp/import:
    post:
      tags: [MCP]
      operationId: importLocalMCPServer
      description: Consumes one revision-bound confirmation and queues an ephemeral, one-time local MCP capture.
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmationToken]
              properties: {confirmationToken: {type: string, minLength: 1, writeOnly: true}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: Include archived Profiles after active Profiles.
          schema: {type: boolean, default: false}
      responses:
        '200': {$ref: '#/components/responses/ProfileList'}
    post:
      tags: [Profiles]
      operationId: createProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfileInput'}}}
      responses:
        '201': {$ref: '#/components/responses/Profile'}
  /profiles/{profileID}:
    parameters: [{$ref: '#/components/parameters/ProfileID'}]
    put:
      tags: [Profiles]
      operationId: updateProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfileInput'}}}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Profiles]
      operationId: deleteProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '409': {$ref: '#/components/responses/Error'}
    get:
      tags: [Profiles]
      operationId: getProfile
      responses:
        '200': {$ref: '#/components/responses/Profile'}
  /profiles/{profileID}/history:
    get:
      tags: [Profiles]
      operationId: profileHistory
      responses:
        '200': {$ref: '#/components/responses/ProfileRevisionList'}
  /profiles/{profileID}/refresh:
    post:
      tags: [Profiles]
      operationId: refreshProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses: {'200': {$ref: '#/components/responses/Profile'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/clone:
    post:
      tags: [Profiles]
      operationId: cloneProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 120}}}}}
      responses: {'201': {$ref: '#/components/responses/Profile'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/archive:
    post:
      tags: [Profiles]
      operationId: archiveProfile
      parameters: [{$ref: '#/components/parameters/ProfileID'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/restore:
    post:
      tags: [Profiles]
      operationId: restoreArchivedProfile
      parameters: [{$ref: '#/components/parameters/ProfileID'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses: {'200': {$ref: '#/components/responses/Profile'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/purge:
    post:
      tags: [Profiles]
      operationId: purgeArchivedProfile
      parameters: [{$ref: '#/components/parameters/ProfileID'}, {$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/secret-bindings:
    get:
      tags: [Profiles]
      operationId: listPendingSecretBindings
      parameters: [{$ref: '#/components/parameters/ProfileID'}]
      responses: {'200': {$ref: '#/components/responses/PendingSecretBindingList'}, '409': {$ref: '#/components/responses/Error'}}
    post:
      tags: [Profiles]
      operationId: completePendingSecretBindings
      parameters: [{$ref: '#/components/parameters/ProfileID'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, values]
              properties:
                revision: {type: integer, minimum: 1}
                values: {type: object, additionalProperties: {type: string, writeOnly: true}}
      responses: {'200': {$ref: '#/components/responses/Profile'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/bundle/export:
    post:
      tags: [Profiles]
      operationId: exportProfileBundle
      parameters: [{$ref: '#/components/parameters/ProfileID'}, {$ref: '#/components/parameters/CSRFToken'}]
      responses: {'200': {description: Standard Profile Bundle, headers: {Content-Disposition: {schema: {type: string}}}, content: {application/octet-stream: {schema: {type: string, format: binary}}}}}
  /profiles/{profileID}/bundle/export-secrets:
    post:
      tags: [Profiles]
      operationId: exportSecretProfileBundle
      description: Explicit plaintext Secret backup. Requires current-password reauthentication and Cache-Control no-store.
      parameters: [{$ref: '#/components/parameters/ProfileID'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [currentPassword], properties: {currentPassword: {type: string, format: password, writeOnly: true}, originLabel: {type: string}}}}}
      responses: {'200': {description: Plaintext Secret Bundle, headers: {Cache-Control: {schema: {type: string}, description: Must be no-store}, Pragma: {schema: {type: string}}, Content-Disposition: {schema: {type: string}}}, content: {application/octet-stream: {schema: {type: string, format: binary}}}}}
  /profiles/bundles/preview:
    post:
      tags: [Profiles]
      operationId: previewProfileBundle
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}, multipart/form-data: {schema: {type: object, required: [bundle], properties: {bundle: {type: string, format: binary}}}}}
      responses: {'200': {description: Bundle preview, content: {application/json: {schema: {$ref: '#/components/schemas/BundlePreview'}}}}, '400': {$ref: '#/components/responses/Error'}}
  /profiles/bundles/import:
    post:
      tags: [Profiles]
      operationId: importProfileBundle
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {multipart/form-data: {schema: {type: object, required: [bundle, confirmationToken], properties: {bundle: {type: string, format: binary}, confirmationToken: {type: string, writeOnly: true}, name: {type: string}, confirmDuplicate: {type: boolean}, importAsNew: {type: boolean}}}}}
      responses: {'201': {$ref: '#/components/responses/Profile'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/preflight:
    post:
      tags: [Profiles]
      operationId: preflightProfile
      description: Verifies the Profile native client version, resolves current Library revisions, and returns five-minute, one-use confirmation tokens. No token is issued when native inspection fails.
      parameters:
        - {$ref: '#/components/parameters/ProfileID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetIds]
              properties:
                targetIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200': {$ref: '#/components/responses/PreflightList'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /profiles/{profileID}/apply:
    post:
      tags: [Profiles]
      operationId: applyProfile
      parameters:
        - {$ref: '#/components/parameters/ProfileID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmationTokens]
              properties:
                confirmationTokens: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /nodes:
    get:
      tags: [Targets]
      operationId: listNodes
      responses:
        '200': {$ref: '#/components/responses/NodeList'}
  /nodes/refresh:
    post:
      tags: [Targets]
      operationId: refreshNodes
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /nodes/{nodeID}:
    patch:
      tags: [Targets]
      operationId: updateNodeManagedUsername
      description: Sets a Salt node managed-username override. An empty string clears the override and restores the global managed username.
      parameters:
        - {$ref: '#/components/parameters/NodeID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [managedUsername]
              properties: {managedUsername: {type: string, maxLength: 32, pattern: '^(?:[a-z_][a-z0-9_-]{0,31})?$'}}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /targets:
    get:
      tags: [Targets]
      operationId: listTargets
      responses:
        '200': {$ref: '#/components/responses/TargetList'}
  /targets/{targetID}:
    get:
      tags: [Targets]
      operationId: getTarget
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      responses:
        '200':
          description: Target, latest inventory, and active immutable desired snapshot.
          content: {application/json: {schema: {$ref: '#/components/schemas/TargetDetail'}}}
        '404': {$ref: '#/components/responses/Error'}
  /targets/{targetID}/scan:
    post:
      tags: [Targets]
      operationId: scanTarget
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /targets/{targetID}/skill-import:
    post:
      tags: [Targets]
      operationId: importLocalSkill
      description: Queues an immutable Library import of one scanned, unmanaged local Skill.
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, expectedRevision, contentHash]
              properties:
                name: {type: string, minLength: 1}
                expectedRevision: {$ref: '#/components/schemas/SHA256'}
                contentHash: {$ref: '#/components/schemas/SHA256'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
        '409': {$ref: '#/components/responses/Error'}
  /targets/{targetID}/skill-imports:
    post:
      tags: [Targets]
      operationId: importLocalHermesSkills
      description: Queues an independently committed, opaque-ID Hermes batch capped at 50 items.
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetRevision, items]
              properties:
                targetRevision: {$ref: '#/components/schemas/SHA256'}
                confirmUpdates: {type: boolean}
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, slug, contentHash]
                    properties: {id: {type: string, minLength: 1}, slug: {type: string}, contentHash: {$ref: '#/components/schemas/SHA256'}}
      responses: {'202': {$ref: '#/components/responses/Operation'}, '409': {$ref: '#/components/responses/Error'}}
  /targets/{targetID}/mcp-import/preflight:
    post:
      tags: [Targets]
      operationId: preflightLocalMCPImport
      description: Returns only sanitized local user-scope MCP fields and key names; secret values are never returned to the browser.
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '200':
          description: Five-minute, one-use confirmations bound to the current native configuration revision.
          content: {application/json: {schema: {$ref: '#/components/schemas/LocalMCPImportPreflight'}}}
        '409': {$ref: '#/components/responses/Error'}
  /targets/{targetID}/backups:
    get:
      tags: [Targets]
      operationId: listBackups
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      responses:
        '200': {$ref: '#/components/responses/BackupList'}
  /targets/{targetID}/restore:
    post:
      tags: [Targets]
      operationId: restoreTarget
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [backupId, expectedRevision]
              properties: {backupId: {$ref: '#/components/schemas/UUID'}, expectedRevision: {$ref: '#/components/schemas/SHA256'}}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /targets/{targetID}/profile-adoption:
    post:
      tags: [Targets, Profiles]
      operationId: adoptRestoredTargetProfile
      description: Creates a new Profile from the active desired snapshot only when its source is restore.
      parameters: [{$ref: '#/components/parameters/TargetID'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 120}}}}}
      responses: {'201': {$ref: '#/components/responses/Profile'}, '409': {$ref: '#/components/responses/Error'}}
  /targets/{targetID}/relay/{action}:
    post:
      tags: [Targets]
      operationId: relayAction
      parameters:
        - {$ref: '#/components/parameters/TargetID'}
        - {name: action, in: path, required: true, schema: {type: string, enum: [start, stop, restart, health]}}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /relay/configuration:
    get:
      tags: [Governance]
      operationId: getRelayConfiguration
      responses: {'200': {description: Current and applied Relay Configuration, content: {application/json: {schema: {$ref: '#/components/schemas/RelayConfigurationProjection'}}}}}
    put:
      tags: [Governance]
      operationId: saveRelayConfiguration
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayConfigurationInput'}}}}
      responses: {'200': {description: Immutable Relay Configuration revision, content: {application/json: {schema: {$ref: '#/components/schemas/RelayConfigurationRevision'}}}}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /relay/configuration/prepare-profile-updates:
    post:
      tags: [Governance]
      operationId: prepareRelayProfileUpdates
      description: Creates exact candidate Profile revisions from their Published predecessors. Repeating the same preparation is a no-op; a conflicting current draft returns 409 and is never replaced.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GovernanceRevisionRequest'}}}}
      responses: {'200': {description: Affected Profile IDs, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/UUID'}}}}}}}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /relay/configuration/preflight:
    post:
      tags: [Governance]
      operationId: preflightRelayConfiguration
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayPreflightRequest'}}}}
      responses: {'200': {description: Revision-bound Relay preflight, content: {application/json: {schema: {$ref: '#/components/schemas/RelayPreflightResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /relay/configuration/apply:
    post:
      tags: [Governance]
      operationId: applyRelayConfiguration
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayApplyRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Operation'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /relay/contracts:
    get:
      tags: [Governance]
      operationId: listRelayContracts
      responses: {'200': {description: Latest and accepted contracts plus rename proposals, content: {application/json: {schema: {$ref: '#/components/schemas/ContractGovernanceProjection'}}}}}
  /relay/contracts/observe:
    post:
      tags: [Governance]
      operationId: observeRelayContracts
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses: {'202': {$ref: '#/components/responses/Operation'}, '400': {$ref: '#/components/responses/Error'}}
  /relay/contracts/{revisionID}/accept:
    post:
      tags: [Governance]
      operationId: acceptRelayContract
      parameters:
        - {name: revisionID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /relay/renames/{proposalID}/confirm:
    post:
      tags: [Governance]
      operationId: confirmRelayRename
      description: Confirms a unique suspected rename or an explicitly selected ambiguous proposal. Selecting an ambiguous mapping atomically rejects competing proposals in the same contract transition that share the old or new tool identity.
      parameters:
        - {name: proposalID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody: {$ref: '#/components/requestBodies/EmptyObject'}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /mcp/policy:
    get:
      tags: [Governance]
      operationId: getGlobalPolicy
      responses: {'200': {description: Current and applied Global Policy, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalPolicyProjection'}}}}}
    put:
      tags: [Governance]
      operationId: saveGlobalPolicy
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalPolicyInput'}}}}
      responses: {'200': {description: Immutable Global Policy revision, content: {application/json: {schema: {$ref: '#/components/schemas/GlobalPolicyRevision'}}}}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /mcp/policy/apply:
    post:
      tags: [Governance]
      operationId: applyGlobalPolicy
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyApplyRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Operation'}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /profiles/{profileID}/launch:
    get:
      tags: [Governance]
      operationId: getProfileLaunchReadiness
      parameters: [{$ref: '#/components/parameters/ProfileID'}]
      responses: {'200': {description: Verified native launch readiness, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileLaunchReadiness'}}}}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /relay/confirmations:
    get:
      tags: [Governance]
      operationId: listRelayConfirmations
      responses: {'200': {description: Payload-free ephemeral confirmation summaries, content: {application/json: {schema: {type: object, additionalProperties: false, required: [items], properties: {items: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/ConfirmationSummary'}}}}}}}, '502': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /relay/confirmations/{challengeID}/approve:
    post:
      tags: [Governance]
      operationId: approveRelayConfirmation
      description: Approves only when the challenge revision and exact Profile name still match the currently Published immutable revision; a later draft does not invalidate that binding.
      parameters:
        - {name: challengeID, in: path, required: true, schema: {$ref: '#/components/schemas/SHA256'}}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmationApproveRequest'}}}}
      responses: {'200': {description: Ephemeral 60-second grant, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmationApprovalResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /relay/confirmations/{challengeID}/reject:
    post:
      tags: [Governance]
      operationId: rejectRelayConfirmation
      parameters:
        - {name: challengeID, in: path, required: true, schema: {$ref: '#/components/schemas/SHA256'}}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmationRejectRequest'}}}}
      responses: {'200': {description: Ephemeral rejection without a grant, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmationRejectionResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '500': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /relay/observations/live:
    get:
      tags: [Governance]
      operationId: liveRelayObservations
      parameters:
        - {name: afterBootId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: afterSequence, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses: {'200': {description: Payload-free live observations, content: {application/json: {schema: {$ref: '#/components/schemas/ObservationDrainResponse'}}}}, '400': {$ref: '#/components/responses/Error'}, '502': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}
  /relay/observations/daily:
    get:
      tags: [Governance]
      operationId: dailyRelayObservations
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 31, default: 30}}
        - {name: profileId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      responses: {'200': {description: Bounded daily aggregates, content: {application/json: {schema: {type: object, required: [items, days], properties: {items: {type: array, maxItems: 5000, items: {$ref: '#/components/schemas/DailyToolAggregate'}}, days: {type: integer, minimum: 1, maximum: 31}}}}}}, '400': {$ref: '#/components/responses/Error'}}
  /operations:
    get:
      tags: [Operations]
      operationId: listOperations
      responses:
        '200': {$ref: '#/components/responses/OperationList'}
  /operations/{operationID}:
    get:
      tags: [Operations]
      operationId: getOperation
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '404': {$ref: '#/components/responses/Error'}
  /operations/{operationID}/cancel:
    post:
      tags: [Operations]
      operationId: cancelOperation
      parameters:
        - {$ref: '#/components/parameters/OperationID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '409': {$ref: '#/components/responses/Error'}
  /operations/{operationID}/retry-failed:
    post:
      tags: [Operations]
      operationId: retryFailedTargets
      parameters:
        - {$ref: '#/components/parameters/OperationID'}
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
  /audit:
    get:
      tags: [Operations]
      operationId: listAudit
      responses:
        '200': {$ref: '#/components/responses/AuditList'}
  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      responses:
        '200': {$ref: '#/components/responses/Settings'}
    put:
      tags: [Settings]
      operationId: updateSettings
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SettingsInput'}}}
      responses:
        '200': {$ref: '#/components/responses/Settings'}
        '400': {$ref: '#/components/responses/Error'}
  /updates/check:
    post:
      tags: [Settings]
      operationId: checkUpdates
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Operation'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: toolhub_session}
  parameters:
    CSRFToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    NodeID: {name: nodeID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    TargetID: {name: targetID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ProfileID: {name: profileID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ServerID: {name: serverID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    OperationID: {name: operationID, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
  requestBodies:
    EmptyObject:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: false, maxProperties: 0}}}
    JSONObject:
      required: true
      content: {application/json: {schema: {type: object}}}
  responses:
    NoContent: {description: No content}
    Error:
      description: Error envelope
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    Session: {description: Session state, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    SessionProbe: {description: Authenticated or anonymous session probe, content: {application/json: {schema: {$ref: '#/components/schemas/SessionProbe'}}}}
    Skill: {description: Immutable Skill library record, content: {application/json: {schema: {$ref: '#/components/schemas/Skill'}}}}
    SkillList: {description: Skills, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Skill'}}}}}}}
    MCPServer: {description: MCP server without secret values, content: {application/json: {schema: {$ref: '#/components/schemas/MCPServer'}}}}
    MCPServerList: {description: MCP servers, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/MCPServer'}}}}}}}
    Profile: {description: Unified Profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
    ProfileList: {description: Profiles, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Profile'}}}}}}}
    ProfileRevisionList: {description: Immutable Profile revision history, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/ProfileRevision'}}}}}}}
    PendingSecretBindingList: {description: Pending write-only secret slots, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PendingSecretBinding'}}}}}}}
    NodeList: {description: Nodes, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Node'}}}}}}}
    TargetList: {description: Targets, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Target'}}}}}}}
    Operation: {description: Durable operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
    OperationList: {description: Operations, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Operation'}}}}}}}
    BackupList: {description: Backups, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Backup'}}}}}}}
    AuditList: {description: Actorless audit events, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}}}}}}
    Settings: {description: Singleton settings, content: {application/json: {schema: {$ref: '#/components/schemas/Settings'}}}}
    PreflightList: {description: Per-target preflight confirmations, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/PreflightItem'}}}}}}}
  schemas:
    UUID: {type: string, format: uuid}
    PolicyReasonCode:
      type: string
      enum: [explicit_override, annotation_deny, annotation_destructive, annotation_mutating, annotation_read_only, catalog_destructive, catalog_credential, catalog_external_publish, catalog_financial, catalog_command_execution, schema_mutating, unclassified_mutating, reviewed_read_only, unclassified, operator_review, compatibility-mode, profile-rule, schema_changed, presentation_changed, server_visibility, rename_confirmed]
    Username: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,31}$'}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
            details: {type: object}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        password: {type: string, format: password, writeOnly: true}
    Account:
      type: object
      additionalProperties: false
      required: [username, passwordChangeRecommended, createdAt, updatedAt]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        passwordChangeRecommended: {type: boolean}
        passwordChangedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Session:
      type: object
      additionalProperties: false
      required: [authenticated, user, csrfToken, expiresAt]
      properties:
        authenticated: {const: true}
        user: {$ref: '#/components/schemas/Account'}
        csrfToken: {type: string, writeOnly: true}
        expiresAt: {type: string, format: date-time}
    SessionProbe:
      oneOf:
        - type: object
          additionalProperties: false
          required: [authenticated]
          properties:
            authenticated: {const: false}
        - type: object
          additionalProperties: false
          required: [authenticated, user, csrfToken, expiresAt]
          properties:
            authenticated: {const: true}
            user:
              type: object
              additionalProperties: false
              required: [username, passwordChangeRecommended]
              properties:
                username: {$ref: '#/components/schemas/Username'}
                passwordChangeRecommended: {type: boolean}
            csrfToken: {type: string, writeOnly: true}
            expiresAt: {type: string, format: date-time}
    Overview:
      type: object
      required: [targets, unhealthyTargets, skills, mcpServers, activeOperations, openAlerts, auditEvents24h]
      properties:
        targets: {type: integer}
        unhealthyTargets: {type: integer}
        skills: {type: integer}
        mcpServers: {type: integer}
        activeOperations: {type: integer}
        openAlerts: {type: integer}
        auditEvents24h: {type: integer}
    SkillSourceInput:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {type: string, enum: [git, skillsmp, xiaping]}
        name: {type: string}
        url: {type: string, format: uri}
        subdirectory: {type: string}
        commit: {type: string}
        metadata: {type: object}
    Skill:
      type: object
      required: [id, slug, name, sourceKind, currentVersionId, currentSha256, currentContentHash, manifest, scanReport, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        sourceKind: {type: string, enum: [zip, git, skillsmp, xiaping, local]}
        sourceUrl: {type: string}
        sourceCommit: {type: string}
        currentVersionId: {$ref: '#/components/schemas/UUID'}
        currentSha256: {$ref: '#/components/schemas/SHA256'}
        currentContentHash: {$ref: '#/components/schemas/SHA256'}
        manifest: {type: object}
        scanReport: {type: object}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MCPServerInput:
      type: object
      additionalProperties: false
      required: [name, description, transport, command, args, url, env, headers]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}
        description: {type: string}
        transport: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        env: {$ref: '#/components/schemas/WriteOnlySecretMap'}
        headers: {$ref: '#/components/schemas/WriteOnlySecretMap'}
    WriteOnlySecretMap:
      type: object
      writeOnly: true
      additionalProperties: {type: string, writeOnly: true}
      description: Non-empty values create/replace secrets; an existing key with an empty value is retained; an omitted key is removed.
    MCPServer:
      type: object
      required: [id, name, revision, transport, args, envKeys, headerKeys, contentHash, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        description: {type: string}
        revision: {type: integer, minimum: 1}
        transport: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        envKeys: {type: array, items: {type: string}}
        headerKeys: {type: array, items: {type: string}}
        contentHash: {$ref: '#/components/schemas/SHA256'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LocalMCPServerPreview:
      type: object
      additionalProperties: false
      required: [name, transport, args, envKeys, headerKeys, contentHash, confirmationToken, expiresAt]
      properties:
        name: {type: string}
        transport: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        envKeys: {type: array, items: {type: string}}
        headerKeys: {type: array, items: {type: string}}
        contentHash: {$ref: '#/components/schemas/SHA256'}
        confirmationToken: {type: string, writeOnly: true}
        expiresAt: {type: string, format: date-time}
    LocalMCPImportPreflight:
      type: object
      additionalProperties: false
      required: [targetRevision, items]
      properties:
        targetRevision: {$ref: '#/components/schemas/SHA256'}
        items: {type: array, items: {$ref: '#/components/schemas/LocalMCPServerPreview'}}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [name, description, revision, skillIds, mcpServerIds]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string}
        clientKind: {type: string, enum: [claude, codex, shared, unknown]}
        category: {type: string, maxLength: 120}
        variant: {type: string, maxLength: 64}
        migrationState: {type: string, enum: [ready, needs_review, compatibility]}
        revision: {type: integer, minimum: 0}
        skillIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
        mcpServerIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
        skillVersionIds: {type: object, additionalProperties: {$ref: '#/components/schemas/UUID'}}
        mcpRevisionIds: {type: object, additionalProperties: {$ref: '#/components/schemas/UUID'}}
        mcpGovernance: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ProfileMCPGovernance'}}
        toolRules: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ProfileToolRule'}}
    ProfileSkillPin:
      type: object
      required: [skillId, versionId, slug, name, sha256, contentHash, current]
      properties:
        skillId: {$ref: '#/components/schemas/UUID'}
        versionId: {$ref: '#/components/schemas/UUID'}
        slug: {type: string}
        name: {type: string}
        sha256: {$ref: '#/components/schemas/SHA256'}
        contentHash: {$ref: '#/components/schemas/SHA256'}
        current: {type: boolean}
    ProfileMCPPin:
      type: object
      required: [serverId, revisionId, revision, name, transport, envKeys, headerKeys, contentHash, current]
      properties:
        serverId: {$ref: '#/components/schemas/UUID'}
        revisionId: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, minimum: 1}
        name: {type: string}
        transport: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        envKeys: {type: array, items: {type: string}}
        headerKeys: {type: array, items: {type: string}}
        contentHash: {$ref: '#/components/schemas/SHA256'}
        current: {type: boolean}
    ProfileMCPGovernance:
      type: object
      additionalProperties: false
      required: [serverId, mcpRevisionId, visibilityMode]
      properties:
        serverId: {$ref: '#/components/schemas/UUID'}
        mcpRevisionId: {$ref: '#/components/schemas/UUID'}
        acceptedContractRevisionId: {$ref: '#/components/schemas/UUID'}
        visibilityMode: {type: string, enum: [all_accepted, selected, hidden]}
    ProfileToolRule:
      type: object
      additionalProperties: false
      required: [toolId, visible, decision]
      properties:
        toolId: {$ref: '#/components/schemas/UUID'}
        visible: {type: boolean}
        decision: {type: string, enum: [deny, confirm, allow]}
        reasonCodes: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/PolicyReasonCode'}}
    PendingSecretBinding:
      type: object
      required: [profileRevisionId, mcpRevisionId, namespace, key, slotHash, bound]
      properties:
        profileRevisionId: {$ref: '#/components/schemas/UUID'}
        mcpRevisionId: {$ref: '#/components/schemas/UUID'}
        namespace: {type: string, enum: [env, header]}
        key: {type: string}
        slotHash: {$ref: '#/components/schemas/SHA256'}
        bound: {type: boolean}
        boundAt: {type: [string, 'null'], format: date-time}
    Profile:
      allOf:
        - {$ref: '#/components/schemas/ProfileInput'}
        - type: object
          required: [id, currentRevisionId, canonicalHash, pendingBindings, skills, mcpServers, mcpGovernance, toolRules, effectiveVisibleCount, createdAt, updatedAt]
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            currentRevisionId: {$ref: '#/components/schemas/UUID'}
            publishedRevisionId: {$ref: '#/components/schemas/UUID'}
            publishedRevision: {type: integer, minimum: 1}
            publishedAt: {type: string, format: date-time}
            canonicalHash: {$ref: '#/components/schemas/SHA256'}
            pendingBindings: {type: boolean}
            archivedAt: {type: [string, 'null'], format: date-time}
            skills: {type: array, items: {$ref: '#/components/schemas/ProfileSkillPin'}}
            mcpServers: {type: array, items: {$ref: '#/components/schemas/ProfileMCPPin'}}
