    MCPServer:
      type: object
      required: [id, name, revision, transport, args, envKeys, headerKeys, contentHash, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        description: {type: string}
        revision: {type: integer, minimum: 1}
        transport: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        envKeys: {type: array, items: {type: string}}
        headerKeys: {type: array, items: {type: string}}
        contentHash: {$ref: '#/components/schemas/SHA256'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LocalMCPServerPreview:
      type: object
      additionalProperties: false
      required: [name, transport, args, envKeys, headerKeys, contentHash, confirmationToken, expiresAt]
      properties:
        name: {type: string}
        transport: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        url: {type: string}
        envKeys: {type: array, items: {type: string}}
        headerKeys: {type: array, items: {type: string}}
        contentHash: {$ref: '#/components/schemas/SHA256'}
