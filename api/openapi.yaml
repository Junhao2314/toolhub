        updatedAt: {type: string, format: date-time, readOnly: true}
    Settings:
      allOf:
        - {$ref: '#/components/schemas/SettingsInput'}
        - type: object
          required: [updatedAt]
    RelayStatus:
      type: object
      additionalProperties: false
      required: [state, healthy, intentionalPaused, endpoint, fixedPort, systemdEnabled]
      properties:
        state: {type: string}
        healthy: {type: boolean}
        intentionalPaused: {type: boolean}
        endpoint: {type: string, format: uri}
        fixedPort: {type: integer, minimum: 1, maximum: 65535}
        systemdEnabled: {type: boolean}
        version: {type: string}
        contract: {type: string, enum: [verified, incompatible, unavailable]}
        memberStatuses: {type: array, items: {$ref: '#/components/schemas/RelayMemberStatus'}}
