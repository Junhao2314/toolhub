name: toolhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: toolhub-postgres
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_DB: toolhub
      POSTGRES_USER: toolhub
      POSTGRES_PASSWORD: ${TOOLHUB_POSTGRES_PASSWORD:-toolhub-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolhub -d toolhub"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  toolhub:
    build:
      context: .
      args:
        VCS_REVISION: ${VCS_REVISION:-dev}
    container_name: toolhub
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "-T", "2", "http://127.0.0.1:18480/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TOOLHUB_LISTEN_ADDR: 0.0.0.0:18480
      TOOLHUB_DATABASE_URL: postgres://toolhub:${TOOLHUB_POSTGRES_PASSWORD:-toolhub-local-only}@postgres:5432/toolhub?sslmode=disable
      TOOLHUB_MASTER_KEY: ${TOOLHUB_MASTER_KEY:?TOOLHUB_MASTER_KEY is required}
      TOOLHUB_BOOTSTRAP_USERNAME: ${TOOLHUB_BOOTSTRAP_USERNAME:-admin}
      TOOLHUB_BOOTSTRAP_PASSWORD: ${TOOLHUB_BOOTSTRAP_PASSWORD:-}
      TOOLHUB_LOCAL_NODE_NAME: ${TOOLHUB_LOCAL_NODE_NAME:-project-host}
      TOOLHUB_MANAGED_USERNAME: ${TOOLHUB_MANAGED_USERNAME:?TOOLHUB_MANAGED_USERNAME is required}
      TOOLHUB_BRIDGE_SOCKET: /run/toolhub-bridge/bridge.sock
      TOOLHUB_BRIDGE_HMAC_KEY: ${TOOLHUB_BRIDGE_HMAC_KEY:?TOOLHUB_BRIDGE_HMAC_KEY is required}
      TOOLHUB_RELAY_PORT: ${TOOLHUB_RELAY_PORT:-6276}
      TOOLHUB_TIMEZONE: ${TOOLHUB_TIMEZONE:-Asia/Shanghai}
      TOOLHUB_SECURE_COOKIES: ${TOOLHUB_SECURE_COOKIES:-true}
      SKILLSMP_API_KEY: ${SKILLSMP_API_KEY:-}
      XIAPING_API_KEY: ${XIAPING_API_KEY:-}
      XIAPING_BASE_URL: ${XIAPING_BASE_URL:-https://xiaping.coze.com}
      SKILLHUB_BASE_URL: ${SKILLHUB_BASE_URL:-https://api.skillhub.tencent.com}
    ports:
      - "127.0.0.1:${TOOLHUB_PORT:-18480}:18480"
    group_add:
      - "${TOOLHUB_BRIDGE_GID:?TOOLHUB_BRIDGE_GID is required}"
    volumes:
      - type: bind
        source: ${TOOLHUB_BRIDGE_RUN_DIR:-/run/toolhub-bridge}
        target: /run/toolhub-bridge
        read_only: true
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres_data:
