name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: toolhub_test
          POSTGRES_USER: toolhub
          POSTGRES_PASSWORD: toolhub-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toolhub -d toolhub_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TOOLHUB_TEST_DATABASE_URL: postgres://toolhub:toolhub-test-only@127.0.0.1:5432/toolhub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.22.x', cache: true }
      - run: go test ./...
      - run: go vet ./...
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/salt/tests -p '*_test.py'

  bridge-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.22.x', cache: true }
      - run: go build -o toolhub-bridge ./cmd/toolhub-bridge

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22.12', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22.12', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: web
      - uses: actions/setup-go@v7
        with: { go-version: '1.22.x', cache: true }
      - name: Start host Bridge
        env:
          TOOLHUB_BRIDGE_HMAC_KEY: 0123456789abcdef0123456789abcdef
        run: |
          bridge_group="$(id -gn)"
          bridge_gid="$(id -g)"
          printf 'TOOLHUB_BRIDGE_RUN_DIR=/tmp/toolhub-bridge-run\n' >> "$GITHUB_ENV"
          printf 'TOOLHUB_BRIDGE_GID=%s\n' "$bridge_gid" >> "$GITHUB_ENV"
          go build -o /tmp/toolhub-bridge ./cmd/toolhub-bridge
          install -d -m 0750 /tmp/toolhub-bridge-run /tmp/toolhub-bridge-state /tmp/toolhub-salt-states
          sudo install -o root -g root -m 0600 /dev/null /tmp/toolhub-bridge-key
          printf '%s\n' "$TOOLHUB_BRIDGE_HMAC_KEY" | sudo tee /tmp/toolhub-bridge-key >/dev/null
          sudo /tmp/toolhub-bridge --socket /tmp/toolhub-bridge-run/bridge.sock --group "$bridge_group" --key-file /tmp/toolhub-bridge-key --journal /tmp/toolhub-bridge-state/journal.db --staging-root /tmp/toolhub-bridge-state/staging --backup-root /tmp/toolhub-bridge-state/backups --salt-state-root /tmp/toolhub-salt-states >/tmp/toolhub-bridge.log 2>&1 &
          for attempt in $(seq 1 50); do
            test -S /tmp/toolhub-bridge-run/bridge.sock && break
            sleep 0.1
          done
          test -S /tmp/toolhub-bridge-run/bridge.sock
      - name: Start ToolHub
        env:
          TOOLHUB_MASTER_KEY: 0123456789abcdef0123456789abcdef
          TOOLHUB_BRIDGE_HMAC_KEY: 0123456789abcdef0123456789abcdef
          TOOLHUB_BOOTSTRAP_USERNAME: admin
          TOOLHUB_BOOTSTRAP_PASSWORD: ToolHubLocal-2026-ChangeMe
          TOOLHUB_MANAGED_USERNAME: runner
          TOOLHUB_SECURE_COOKIES: 'false'
        run: docker compose up -d --build --wait
      - name: API smoke
        env:
          TOOLHUB_SMOKE_USERNAME: admin
          TOOLHUB_SMOKE_PASSWORD: ToolHubLocal-2026-ChangeMe
        run: sh scripts/smoke-api.sh
      - name: Browser smoke
        env:
          TOOLHUB_E2E_USERNAME: admin
          TOOLHUB_E2E_PASSWORD: ToolHubLocal-2026-ChangeMe
        run: npm run test:e2e
        working-directory: web
      - name: Diagnostics
        if: always()
        env:
          TOOLHUB_MASTER_KEY: 0123456789abcdef0123456789abcdef
          TOOLHUB_BRIDGE_HMAC_KEY: 0123456789abcdef0123456789abcdef
          TOOLHUB_BOOTSTRAP_USERNAME: admin
          TOOLHUB_BOOTSTRAP_PASSWORD: ToolHubLocal-2026-ChangeMe
          TOOLHUB_MANAGED_USERNAME: runner
        run: |
          export TOOLHUB_BRIDGE_GID="${TOOLHUB_BRIDGE_GID:-0}"
          export TOOLHUB_BRIDGE_RUN_DIR="${TOOLHUB_BRIDGE_RUN_DIR:-/tmp/toolhub-bridge-run}"
          docker compose logs --no-color || true
          test ! -f /tmp/toolhub-bridge.log || cat /tmp/toolhub-bridge.log
